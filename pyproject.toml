[project]
name = "norwegian-pharma-pipeline"
version = "1.0.0"
description = "Norwegian pharmaceutical tender extraction pipeline (Assignment C)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "openpyxl>=3.1.2",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pypdf>=4.0.0",
    "python-dateutil>=2.8.2",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "mypy>=1.7.0"]

[project.scripts]
norwegian-pipeline = "norwegian_pipeline.pipeline:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["norwegian_pipeline*"]
